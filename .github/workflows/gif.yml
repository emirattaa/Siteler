name: Generate ASCII HTML from GIF

on:
  push:
    paths:
      - 'me/gif/kedi.gif'
      - 'me/scripts/generate_ascii.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install Pillow

      - name: Run ASCII Generator Script
        run: |
          python me/scripts/generate_ascii.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "otomatik: GIF kareleri HTML içine gömüldü"
          file_pattern: 'me/index.html'
          
