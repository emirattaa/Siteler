<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yönlendiriliyor...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #0f0f0f, #1a1a2e, #0b3d2e);
    background-size: 300% 300%;
    animation: bg 10s ease infinite;
    text-align: center;
    padding: 24px;
  }
  @keyframes bg {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 48px 36px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: pop 0.6s ease both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  .spinner {
    width: 56px;
    height: 56px;
    margin: 0 auto 28px;
    border: 5px solid rgba(255, 255, 255, 0.15);
    border-top-color: #1db954;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.7rem; margin-bottom: 10px; }
  p { color: #b3b3b3; font-size: 0.95rem; }
  .bar {
    height: 5px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 99px;
    margin-top: 28px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: #1db954;
    animation: fill 2.5s linear forwards;
  }
  @keyframes fill { to { width: 100%; } }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card" id="redirect">
  <div class="spinner"></div>
  <h1>bcs bitly is ass</h1>
  <div class="bar"><span></span></div>
</div>

<div class="card hidden" id="nothing">
  <h1>Cursed ahh shit link</h1>
</div>

<script>
  // Yeni link eklemek için buraya bir satır ekle
  const links = {
    spf: "https://open.spotify.com/user/31mq5yg6ex4dpub2kk5fkhn472we?si=KOGApyluSxuTbthxdv0TIg&utm_source=copy-link",
    ig: "https://instagram.com/emirattaa"
  };

  // "/spf/" -> "spf"
  const slug = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();

  if (links[slug]) {
    setTimeout(() => location.replace(links[slug]), 1000);
  } else {
    document.getElementById("redirect").classList.add("hidden");
    document.getElementById("nothing").classList.remove("hidden");
  }
</script>
</body>
</html>
