<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çapar - Ball knowledge</title>
    <style>
        :root {
            --bg: #1c1917;
            --card: #292524;
            --border: #44403c;
            --text: #f5f5f4;
            --accent: #d97706; /* Eski zaman / Parşömen tonu kehribar */
            --accent-hover: #b45309;
            --muted: #a8a29e;
        }

        body {
            font-family: 'Georgia', serif, system-ui;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .brand-title {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: var(--accent);
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 25px;
            font-style: italic;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #1c1917;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 12px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 20px;
            font-family: inherit;
            font-size: 1rem;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 20px;
            word-break: break-all;
            background: #1c1917;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .message-display {
            font-size: 1.15rem;
            line-height: 1.7;
            white-space: pre-wrap;
            background: #1c1917;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            text-align: left;
            margin-top: 15px;
        }

        /* Bekleme / Yükleme Animasyonu */
        .loader-container {
            padding: 30px 10px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="brand-title">ÇAPAR</h1>
    <div class="subtitle">— Ball knowledge —</div>

    <div id="loading-section" class="loader-container hidden">
        <div class="spinner"></div>
        <p style="font-size: 1.1rem; color: var(--accent);">bekle gelio</p>
        <p style="color: var(--muted); font-size: 0.9rem;">Çapardan .esaj geldi 10 bilemedin 12 daikaya ordayım dedi.</p>
    </div>

    <div id="read-section" class="hidden">
        <p style="color: var(--muted); margin-bottom: 5px;">Bu kişinin sana mesajı var:</p>
        <div id="message-content" class="message-display"></div>
        <br>
        <button onclick="window.location.href = window.location.pathname">Sen de Bir Çapar Gönder</button>
    </div>

    <div id="create-section">
        <p style="color: var(--muted); margin-top: 0;">Mektubunu yaz, Çapar ulağı bağlama tıklandığında alıcısına ulaştırsın.</p>
        <textarea id="message-input" placeholder="Gizli mesajınızı buraya yazın..."></textarea>

        <button onclick="generateLink()">Çapar Linki Oluştur</button>

        <div id="result-section" class="result-box hidden">
            <p style="margin-top:0; color: var(--muted); font-size: 0.9rem;">Hazır Olan Çapar Bağlantısı:</p>
            <input type="text" id="link-output" readonly style="width: 100%; padding: 10px; background: #292524; border: 1px solid var(--border); color: white; border-radius: 4px; box-sizing: border-box; font-family: inherit;">
            <button onclick="copyLink()" style="margin-top: 10px; background-color: #15803d;">Mektup Linkini Kopyala</button>
        </div>
    </div>
</div>

<script>
    // Unicode destekli Base64 Şifreleme/Çözme
    function encodeData(str) {
        return btoa(encodeURIComponent(str));
    }

    function decodeData(str) {
        return decodeURIComponent(atob(str));
    }

    // Sayfa yüklendiğinde çalışacak kısım
    window.onload = function() {
        const hash = window.location.hash.substring(1);

        if (hash) {
            try {
                const message = decodeData(hash);

                // Oluşturma ekranını gizle, bekleme ekranını göster
                document.getElementById('create-section').classList.add('hidden');
                document.getElementById('loading-section').classList.remove('hidden');

                // 3 saniye (3000 ms) beklet ve ardından mesajı göster
                setTimeout(() => {
                    document.getElementById('loading-section').classList.add('hidden');
                    document.getElementById('read-section').classList.remove('hidden');
                    document.getElementById('message-content').innerText = message;
                }, 3000);

            } catch (e) {
                alert("Çapar mektubu okuyamadı! Geçersiz veya bozuk link.");
                window.location.href = window.location.pathname;
            }
        }
    };

    // Link Oluşturma
    function generateLink() {
        const msg = document.getElementById('message-input').value.trim();

        if (!msg) {
            alert("Lütfen önce bir mesaj yazın!");
            return;
        }

        const encodedMsg = encodeData(msg);
        const generatedUrl = `${window.location.origin}${window.location.pathname}#${encodedMsg}`;

        document.getElementById('link-output').value = generatedUrl;
        document.getElementById('result-section').classList.remove('hidden');
    }

    // Link Kopyalama
    function copyLink() {
        const linkInput = document.getElementById('link-output');
        linkInput.select();
        navigator.clipboard.writeText(linkInput.value);
        alert("Çapar linki panoya kopyalandı!");
    }
</script>

</body>
</html>
